name: Update activity graph

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 KST 03:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch graphs
        run: |
          mkdir -p assets
          fetch() {
            if curl -fsSL --retry 5 --retry-delay 20 "$1" -o "$2.tmp" && grep -q '<svg' "$2.tmp"; then
              mv "$2.tmp" "$2"
            else
              rm -f "$2.tmp"; echo "skip $2"
            fi
          }
          BASE="https://github-readme-activity-graph.vercel.app/graph?username=ainais&area=true&hide_border=true"
          fetch "$BASE&bg_color=ffffff&color=24292f&line=0969da&point=0969da" assets/activity-light.svg
          fetch "$BASE&bg_color=0d1117&color=c9d1d9&line=58a6ff&point=58a6ff" assets/activity-dark.svg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update activity graph"
            git push
          fi
